name: Publish

on:
  release:
    types:
      - created

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"
      - name: Verify release tag matches pyproject version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          tag="${RELEASE_TAG#v}"
          echo "pyproject version: ${version}"
          echo "release tag:       ${RELEASE_TAG} (normalised: ${tag})"
          if [ "${version}" != "${tag}" ]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match pyproject version '${version}'. PyPI versions are immutable — aborting before publish."
            exit 1
          fi
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.4"
      - name: Build distribution
        run: uv build
      - name: Publish
        run: uv publish
